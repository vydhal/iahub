version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_creative_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicreativestudio
    ports:
      # 5433 no host: evita conflito com outros projetos que publicam 5432 nesta máquina.
      # Dentro da rede do compose o serviço continua em postgres:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_creative_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        WITH_BROWSER: "true"
    container_name: ai_creative_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aicreativestudio?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key_simplisoft_pabllo_vittar_2026
      - AI_MOCK_MODE=${AI_MOCK_MODE:-true}
      # Chave de 32 bytes (64 hex) para criptografar credenciais. Troque em qualquer ambiente real.
      - CREDENTIALS_KEY=${CREDENTIALS_KEY:-6b3f0c1e9a7d4b2f8e5c1a0d9f7b3e6c2a4d8f1b7e9c3a5d0f2b6e8a1c4d7f90}
      - RUN_WORKERS=true
      - ALLOW_PRIVATE_NETWORK=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy-openai-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-dummy-anthropic-key}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_creative_frontend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
