version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_creative_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicreativestudio
    ports:
      # 5433 no host: evita conflito com outros projetos que publicam 5432 nesta máquina.
      # Dentro da rede do compose o serviço continua em postgres:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_creative_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        WITH_BROWSER: "true"
    container_name: ai_creative_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aicreativestudio?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Sem default: defina no .env (fora do versionamento). Compose recusa subir sem isso —
      # é de propósito, pra nunca mais rodar com o segredo compartilhado que estava aqui antes.
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env — veja .env.example}
      - AI_MOCK_MODE=${AI_MOCK_MODE:-true}
      # Chave de 32 bytes (64 hex) para criptografar credenciais. Sem default: defina no .env.
      - CREDENTIALS_KEY=${CREDENTIALS_KEY:?defina CREDENTIALS_KEY no .env — veja .env.example}
      - RUN_WORKERS=true
      - ALLOW_PRIVATE_NETWORK=false
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3000}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-http://localhost:8080}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-dummy-openai-key}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-dummy-anthropic-key}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_creative_frontend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
